baseURL = 'https://khomkrit.cc/'
theme = 'PaperMod'

# ==========================================================
# Multilingual
# Thai = default language
# ==========================================================
defaultContentLanguage = 'th'
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = false

# ==========================================================
# Cache
# ==========================================================
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# ==========================================================
# Markup / Syntax Highlighting
# ==========================================================
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = true
    style = 'dracula'
    noClasses = false

# ==========================================================
# Global Params
# ==========================================================
[params]
  env = 'production'
  author = 'Khomkrit'

  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false

  # PaperMod multilingual language selector
  # Show "ไทย" / "English" instead of just "th" / "en"
  displayFullLangName = true

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.label]
    text = 'Khomkrit.cc'

  [params.profileMode]
    enabled = true

# ==========================================================
# Thai
# ==========================================================
[languages.th]
  languageCode = 'th-TH'
  languageName = 'ไทย'
  label = 'ไทย'
  locale = 'th-TH'
  weight = 1

  title = 'Khomkrit | Cloud & Infrastructure Architect'

  [languages.th.params]
    description = 'Senior Systems Engineer specializing in Cloud Infrastructure, Kubernetes, DevOps, AI Infrastructure, and scalable distributed systems.'

  [languages.th.params.profileMode]
    title = 'Khomkrit | Cloud & Infrastructure Architect'
    subtitle = 'Fullstack Engineer / Consultant specializing in high-performance Backend and Enterprise Infrastructure.'

    [[languages.th.params.profileMode.buttons]]
      name = 'Case Studies'
      url = '/case-studies/'

    [[languages.th.params.profileMode.buttons]]
      name = 'Blogs'
      url = '/blogs/'

    [[languages.th.params.profileMode.buttons]]
      name = 'GitHub'
      url = 'https://github.com/azimuth3d'

  # --------------------------------------------------------
  # Thai Main Menu
  # --------------------------------------------------------
  [languages.th.menus]

    [[languages.th.menus.main]]
      identifier = 'case-studies'
      name = 'Case Studies'
      pageRef = '/case-studies'
      weight = 1

    [[languages.th.menus.main]]
      identifier = 'blogs'
      name = 'Blogs'
      pageRef = '/blogs'
      weight = 2

# ==========================================================
# English
# ==========================================================
[languages.en]
  languageCode = 'en-US'
  languageName = 'English'
  label = 'English'
  locale = 'en-US'
  weight = 2

  title = 'Khomkrit | Cloud & Infrastructure Architect'

  [languages.en.params]
    description = 'Senior Systems Engineer specializing in Cloud Infrastructure, Kubernetes, DevOps, AI Infrastructure, and scalable distributed systems.'

  [languages.en.params.profileMode]
    title = 'Khomkrit | Cloud & Infrastructure Architect'
    subtitle = 'Staff Engineer / Consultant specializing in high-performance Backend and Enterprise Infrastructure.'

    [[languages.en.params.profileMode.buttons]]
      name = 'View Case Studies'
      url = '/en/case-studies/'

    [[languages.en.params.profileMode.buttons]]
      name = 'Blogs'
      url = '/en/blogs/'

    [[languages.en.params.profileMode.buttons]]
      name = 'GitHub'
      url = 'https://github.com/azimuth3d'

  # --------------------------------------------------------
  # English Main Menu
  # --------------------------------------------------------
  [languages.en.menus]

    [[languages.en.menus.main]]
      identifier = 'case-studies'
      name = 'Case Studies'
      pageRef = '/case-studies'
      weight = 1

    [[languages.en.menus.main]]
      identifier = 'blogs'
      name = 'Blogs'
      pageRef = '/blogs'
      weight = 2